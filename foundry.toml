[profile.default]
solc_version = "0.8.38"
evm_version = "osaka"
optimizer = true
optimizer_runs = 1_000_000
via_ir = true
bytecode_hash = "ipfs"
cbor_metadata = true
remappings = ["forge-std/=lib/forge-std/src/"]
fs_permissions = [
  { access = "read", path = "./out" },
  { access = "read-write", path = "./verification" },
]

[profile.ci.fuzz]
runs = 10_000

[lint]
exclude_lints = [
  "arbitrary-send-eth",
  "calls-loop",
  "missing-zero-check",
  "reentrancy-eth",
  "reentrancy-events",
  "reentrancy-no-eth",
  "require-revert-in-loop",
]
